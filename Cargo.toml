[package]
name = "domi_blockchain"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"           # For hashing blocks
chrono = "0.4"          # For timestamps
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"         # For binary encoding
ed25519-dalek = "1.0"   # For cryptographic signatures
rand = "0.8"           # For random number generation
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "std"] }
eframe = "0.23"
egui = "0.23"
axum = "0.6" 
tokio = { version = "1", features = ["full"] } 
hyper = { version = "0.14", features = ["client", "http1", "http2", "tcp"] }
 

[dependencies.winapi]
version = "0.3"
features = ["winuser", "windef"]
